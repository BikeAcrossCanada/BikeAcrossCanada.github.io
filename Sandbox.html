<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple Web Map with Scale</title>
  <script type="module" src="https://geogratis.gc.ca/mapml/client/web-map/mapml-viewer.js" crossorigin></script>
  <style>
    html, body { height: 100%; margin: 0; }
    mapml-viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <mapml-viewer projection="OSMTILE" zoom="4" lat="45.0" lon="-75.0" controls>
    <layer- label="OpenStreetMap" src="https://geogratis.gc.ca/mapml/en/osmtile/osm/" checked></layer->
  </mapml-viewer>

</body>
</html>
