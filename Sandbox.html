<!DOCTYPE html>
<html>
<head>
    <title>Simple Web Map with Scale Bar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Make the map fill the entire browser window */
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- The container div where the map will be rendered -->
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Initialize the map and set its center and zoom level
        var map = L.map('map').setView([51.505, -0.09], 13);

        // 3. Add the scale bar control to the map
        L.control.scale({
            metric: true,    // Show kilometers/meters
            imperial: true   // Show miles/feet
        }).addTo(map);
    </script>
</body>
</html>
