<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple MapML Web Map with Scale Bar</title>
  <!-- Load the MapML Viewer polyfill/script -->
  <script type="module" src="https://geogratis.gc.ca" crossorigin></script>
  <style>
    /* Give the map container a defined size */
    mapml-viewer {
      width: 100%;
      height: 500px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- The "controls" attribute automatically renders the scale bar -->
  <mapml-viewer zoom="3" lat="45.0" lon="-90.0" controls>
    <layer- label="OpenStreetMap" src="https://geogratis.gc.ca" checked></layer->
  </mapml-viewer>

</body>
</html>
