<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MapML Viewer - Bottom Left Scale Bar</title>
  <script type="module" src="https://geogratis.gc.ca" crossorigin></script>
  
  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
    }
    
    mapml-viewer { 
      width: 100%; 
      height: 100%; 
    }

    /* Target the control wrapper to move the scale bar to the left side */
    mapml-viewer::part(control-bottommiddle) {
      /* If your version supports the standardized part element wrapper, 
         you can force elements directly into this layout slot */
    }

    /* Alternative override: Force the scale element container left if it defaults right */
    mapml-viewer * .mapml-control-scale {
      position: absolute !important;
      bottom: 10px !important;
      left: 10px !important;
      right: auto !important;
    }
  </style>
</head>
<body>

  <!-- Ensure the 'controls' attribute is active so the scale bar renders -->
  <mapml-viewer projection="OSMTILE" zoom="4" lat="45.0" lon="-75.0" controls>
    <layer- label="OpenStreetMap" src="https://geogratis.gc.ca" checked></layer->
  </mapml-viewer>

</body>
</html>
